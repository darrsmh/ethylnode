; ================================================================
;  PlatformIO configuration  —  Seismic Monitoring System v2.0
;  Target: ESP32-S3 DevKitC-1 (38-pin, Type-C)
;
;  Changes vs v1.2:
;  • Board: esp32-s3-devkitc-1 (replaces generic esp32dev)
;  • Removed: TMRh20/RF24 library (NRF24L01+ no longer used)
;  • Added:  SD library (MicroSD on VSPI)
;  • Removed: BLE stack (no longer used)
;  • Build flag: -DBOARD_HAS_PSRAM (ESP32-S3 has 8 MB PSRAM)
;
;  Flash: pio run -t upload
;  Monitor: pio device monitor
; ================================================================

[platformio]
src_dir = .

[env]
platform          = espressif32
framework         = arduino
board             = esp32-s3-devkitc-1
monitor_speed     = 115200
upload_speed      = 921600
board_build.partitions = huge_app.csv

; ── Library dependencies ──────────────────────────────────────────
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; ── Common build flags ────────────────────────────────────────────
; ARDUINO_USB_CDC_ON_BOOT=1 : ESP32-S3 uses native USB-CDC
; CORE_DEBUG_LEVEL=3          : ESP_LOGx debug output on Serial
; BOARD_HAS_PSRAM=1           : Enable 8 MB PSRAM for large buffers
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM=1

; ── Notes ─────────────────────────────────────────────────────────
; Upload port:
;   PlatformIO auto-detects the COM/tty port.
;   If multiple devices connected, specify:
;     upload_port = COM3        (Windows)
;     upload_port = /dev/ttyACM0  (Linux)
;     upload_port = /dev/cu.usbmodem* (Mac)
;
; ESP32-S3 pinout:
;   The firmware uses GPIO 5,12,13,14,15,18,19,21,22,23,26.
;   All are available on the 38-pin DevKitC-1.
;
; MicroSD power:
;   SD cards can draw 50–100 mA during write. Ensure 3.3V regulator
;   can supply total system current (ESP32-S3 + sensors + SD).
;   Add 100 µF + 10 µF decoupling near SD module VCC pin.
